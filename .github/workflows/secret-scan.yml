name: Secret Scan (Gitleaks)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin v8.30.0
          gitleaks version

      - name: Scan git history
        run: gitleaks git --no-banner --redact .

      - name: Scan working tree
        run: gitleaks dir --no-banner --redact .
